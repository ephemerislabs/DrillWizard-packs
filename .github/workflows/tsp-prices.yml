# Drill Wizard — daily TSP share prices into latest.json
# Lives at .github/workflows/tsp-prices.yml in the DrillWizard-packs repo.
# Runs weekday evenings after tsp.gov posts the day's prices, plus a manual
# Run-workflow button. The updater is fail-closed: a broken feed fails this
# job loudly and commits nothing.
# v2 of the commit step: two runs can race (cron vs retry vs manual) and the
# push loser used to go red for no real reason — now it rebases onto whatever
# won and retries, keeping its own freshly-fetched file content.

name: TSP share prices

on:
  schedule:
    - cron: "30 23 * * 1-5"      # weekdays 23:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parser self-test (no network)
        run: python3 update_tsp_prices.py --selftest

      - name: Fetch prices and update latest.json
        run: python3 update_tsp_prices.py

      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- latest.json; then
            echo "no change — nothing to commit"
            exit 0
          fi
          git config user.name  "dw-prices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          git commit -m "TSP prices $(date -u +%F)"
          # Two runs can race for the one push slot. Rebase our commit onto
          # whatever won and push again. NOTE the rebase inversion: during a
          # rebase, "-X theirs" keeps THIS run's file content — which is the
          # freshest fetch — and an identical already-pushed change simply
          # drops our commit, making the push a clean no-op.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected — rebasing onto the winner (attempt $i)"
            git pull --rebase -X theirs origin main
          done
          git push
